name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  template-check:
    name: Template Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run template verification
        shell: pwsh
        run: pwsh scripts/verify-template.ps1
